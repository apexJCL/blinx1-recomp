schema: spec-driven

context: |
  Project: static recompilation of the original Xbox game BLiNX: the time sweeper (title
  0x4D530013) into a native executable, built on the xboxrecomp toolkit and
  driven by xboxrecomp-cli (./blinx1).
  Layout: src/main.c is the host entry point; src/recomp_manual.c holds
  hand-written overrides; src/recomp/gen/ is generated by `blinx1 analyze` and
  `blinx1 recomp` and is never hand-edited (missed functions are seeded in
  config/seed_functions.json); game_files/ holds the user's own dump and is
  never committed.
  Constraints: no game data, frames, audio or saves are ever committed.
