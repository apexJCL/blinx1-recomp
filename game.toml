# game.toml: what xboxrecomp-cli needs to know about BLiNX: the time sweeper. The CLI reads
# it on every command; every key and its default is in the CLI's
# docs/manifest.md. Written by `xbr new`; the CLI never writes it again.
schema = 1

[game]
name = "BLiNX: the time sweeper"
slug = "blinx1"

[xbe]
path = "game_files/default.xbe"
# The certificate's title ID: `package` refuses a dump with another one.
title_id = 0x4D530013
# The known dump: NTSC-U, version 6, the one recomp_manual.c, the hooks,
# seeds and symbols are keyed to. Another dump is judged by
# [xbe.sections] below (blinx1 fingerprint): a header-only change is known,
# modded data or code builds with a warning, and only bench golden
# refuses it.
sha256 = ["771b8b6347d6f4348b79911210c1e17f7a1cd1fbfd3356d56bebee74f04bf745"]
# Its release, from the certificate (blinx1 fingerprint --toml): a dump of
# another region or version is "another release" in every warning.
region = 0x1  # NTSC-U
version = 6
title = "BLiNX: the time sweeper"

