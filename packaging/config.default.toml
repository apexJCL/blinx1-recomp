# BLiNX: the time sweeper options: every key at its default. Each default is
# the stock behaviour except three: present.pacing sleeps (the frames are the
# same as the console's spin and it frees a CPU core), the in-game menu is on
# (closed, it changes no frame; the game loses only the presses of the chords
# that open it, Guide+A and Back+L3), and the cache partition lives in memory
# (storage.ram_cache: the game sees the same files, the host disk is
# spared). The game reads this file on each launch, beside its executable;
# it is never copied, and an update replaces it, so new keys and defaults
# reach you. Do not edit it: put the
# keys you change in config/config.toml (copy a line from here), which the
# game creates with a short comment the first time and never overwrites.
# Environment variables (RECOMP_*, config/launch.env in a bundle) override
# both. Reference: the toolkit's docs/runtime/config.md.
#
# For the porter: only a build with the toolkit's enhancements layer reads
# it (-DXBOXRECOMP_ENHANCE=ON in game.toml's [build] stock_cmake), and
# `package` stages it only then. Keep a key at the toolkit's default unless
# the game needs another, and say why beside it. The toolkit's [input] keys
# (the keyboard and mouse, off by default) are in docs/runtime/config.md.

[render]
scale = 1                 # internal resolution factor: 1 (stock 640x480) to 4
                          # (Metal and Direct3D 11; the software renderer
                          # ignores it)
aniso = 0                 # anisotropic filtering on mipmapped textures: 0 (stock,
                          # off) or 2..16; sharper ground and walls at a distance
                          # (Metal and Direct3D 11)

[display]
aspect = "4:3"            # only 4:3 so far: wider ratios (Hor+) are untested on
                          # BLiNX

[present]
filter = "nearest"        # "nearest" (stock), "linear", "integer"
fullscreen = false        # true: borderless fullscreen at start
pacing = "sleep"          # "sleep": the game's lowered spin waits sleep until the
                          # kernel signals, which saves CPU and battery; the
                          # frames are the same. "spin" is the console-original
                          # timing: the waits hold a CPU core, as on the Xbox.
                          # No effect yet: BLiNX is not generated with spin
                          # waits ([pipeline] spin_waits)
surface = "auto"          # "auto": the frame-sized surface goes to gamescope for
                          # it to scale when the SteamOS launcher says it runs
                          # there (Steam's FSR needs scale = 1 on a Deck);
                          # "window" (the old behaviour) or "internal"

[menu]
enabled = true            # the in-game menu over the game: F10, Guide+A or
                          # Back+L3 held 0.4 s opens and closes it, and on
                          # macOS an Elite's P1 too (XInput has no paddles).
                          # Steam Deck: SteamOS keeps Guide+A for itself, so
                          # use Back+L3, or bind R4 to F10 once in Steam
                          # Input (the game's controller settings > Back Grip
                          # Buttons > R4 > Keyboard > F10). The game keeps
                          # running behind it and gets no input. Save writes
                          # only what you changed to config/config.toml.
                          # false: no menu; with the strip off too, no
                          # binding below is read

[overlay]
stats = false             # the stats strip in the window's top right corner (fps,
                          # frame ms, pacing, scale, backend); F3 or the
                          # menu's Stats page toggles it while you play

[storage]
ram_cache = true          # the cache partition (Z:) in memory, capped at the
                          # stock 750 MB: the game rewrites 300 cache files of
                          # 1.9 MB in a ring, about 7 GB an hour to the disk
                          # (SSD wear, Deck storage). It starts from
                          # hdd/Cache and writes nothing back; the game
                          # rebuilds the ring as it plays. Costs up to 750 MB
                          # of RAM. false: the files go to hdd/Cache as stock

[input.actions]
# Host actions: what the host does, not the game. To change one, put it
# under [input.actions] in config/config.toml: it replaces this line whole.
# Reference: the toolkit's docs/runtime/config.md, "Host actions".
menu.open = ["F10", "guide+a", "paddle1", "back+left_thumb@400"]
                          # the toolkit's three, plus Back+L3 held 0.4 s for
                          # hosts that never pass Guide on (the Xbox Game Bar
                          # on Windows, Steam under Proton). The game ignores
                          # a lone Back or L3 press in play: Back cancels in
                          # menus (as B does), L3 only counts as "any button"
                          # on screens that wait for one. The first button of
                          # the chord still reaches the game until both are
                          # down (Back alone cancels a menu, either one skips
                          # a wait screen), so press L3 first, or both at once
overlay.stats = "F3"      # toggles the stats strip; no key of the game's

# [textures]
# pack = "none"           # a texture pack file, relative to the executable;
#                         # `package --hud-pack` writes this table itself
# font = "on"             # a pack's font-atlas entries, "on" or "off"
# text = "on"             # a pack's baked-text entries, "on" or "off"
